<style>
  .site-footer {
    position: relative;
    margin-top: 0;
    padding: 0;
    color: #f5f5f2;
    background: #070807;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }

  .site-footer::before {
    display: none;
  }

  .footer-inner {
    position: relative;
    z-index: 1;
    width: min(100% - 2rem, var(--max-width));
    margin-inline: auto;
    padding: clamp(2.6rem, 4.4vw, 4rem) 0 0;
  }

  .footer-main {
    display: grid;
    grid-template-columns: minmax(13rem, 0.95fr) minmax(10rem, 0.72fr) minmax(10rem, 0.72fr) minmax(17rem, 1fr);
    gap: clamp(2rem, 4.4vw, 4.8rem);
    align-items: start;
    padding-bottom: clamp(2.2rem, 3.6vw, 3.4rem);
  }

  .footer-brand {
    display: grid;
    align-content: start;
    max-width: 18rem;
  }

  .footer-logo {
    width: fit-content;
    display: inline-flex;
    align-items: center;
    line-height: 0;
    transition:
      transform var(--medium),
      opacity var(--fast);
  }

  .footer-logo:hover,
  .footer-logo:focus-visible {
    transform: translateY(-2px);
    opacity: 0.92;
  }

  .footer-logo img {
    width: auto;
    height: clamp(64px, 5.2vw, 82px);
    max-width: 244px;
    object-fit: contain;
  }

  .footer-column {
    min-width: 0;
    display: grid;
    align-content: start;
    gap: 1.42rem;
  }

  .footer-column-title {
    position: relative;
    width: fit-content;
    margin: 0;
    color: #ffffff;
    font-size: 0.78rem;
    line-height: 1;
    font-weight: 850;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .footer-column-title::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -0.7rem;
    width: 2.2rem;
    height: 2px;
    border-radius: 999px;
    background: var(--nf-green-light);
    opacity: 0.95;
  }

  .footer-link-list,
  .footer-contact-list {
    display: grid;
    gap: 0.84rem;
  }

  .footer-link-list a {
    position: relative;
    width: fit-content;
    max-width: 100%;
    color: rgba(245, 245, 242, 0.66);
    font-size: 0.94rem;
    line-height: 1.35;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
    transition:
      transform var(--medium),
      color var(--fast);
  }

  .footer-link-list a:hover,
  .footer-link-list a:focus-visible {
    color: #ffffff;
    transform: translateX(3px);
  }

  .footer-contact-block {
    display: grid;
  }

  .footer-contact-item {
    display: grid;
    grid-template-columns: 1.28rem minmax(0, 1fr);
    gap: 0.78rem;
    align-items: center;
    color: rgba(245, 245, 242, 0.7);
    font-size: 0.94rem;
    line-height: 1.35;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
    transition:
      transform var(--medium),
      color var(--fast);
  }

  .footer-contact-item:hover,
  .footer-contact-item:focus-visible {
    color: #ffffff;
    transform: translateX(3px);
  }

  .footer-contact-icon {
    width: 1.28rem;
    height: 1.28rem;
    color: #8fd34a;
  }

  .footer-bottom {
    position: relative;
    z-index: 2;
    width: 100vw;
    margin-left: calc(50% - 50vw);
    padding: 0.9rem max(1rem, calc((100vw - var(--max-width)) / 2 + 1rem));
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 1.15rem;
    flex-wrap: wrap;
    border-top: 1px solid rgba(255, 255, 255, 0.09);
    background: #050605;
  }

  .footer-bottom p {
    margin: 0;
    color: rgba(245, 245, 242, 0.52);
    font-size: 0.82rem;
    line-height: 1.42;
    letter-spacing: -0.01em;
  }

  .footer-bottom-separator {
    width: 1px;
    height: 1.05rem;
    background: rgba(255, 255, 255, 0.14);
  }

  @media (max-width: 1120px) {
    .footer-main {
      grid-template-columns: minmax(0, 1fr) minmax(0, 0.82fr) minmax(0, 0.82fr);
    }

    .footer-brand {
      max-width: 100%;
    }

    .footer-column-contact {
      grid-column: 1 / -1;
      max-width: 42rem;
    }
  }

  @media (max-width: 820px) {
    .footer-inner {
      width: min(100% - 1.2rem, var(--max-width));
      padding-top: 1.75rem;
    }

    .footer-main {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.6rem 1.35rem;
      padding-bottom: 1.7rem;
    }

    .footer-brand {
      grid-column: 1 / -1;
      max-width: 100%;
    }

    .footer-logo img {
      height: 52px;
      max-width: 150px;
    }

    .footer-column {
      gap: 1.08rem;
    }

    .footer-column-title {
      font-size: 0.72rem;
      letter-spacing: 0.108em;
    }

    .footer-column-title::after {
      bottom: -0.56rem;
      width: 2.1rem;
    }

    .footer-link-list {
      gap: 0.48rem;
    }

    .footer-link-list a {
      font-size: 0.86rem;
      line-height: 1.27;
    }

    .footer-column-contact {
      grid-column: 1 / -1;
      max-width: 100%;
    }

    .footer-contact-list {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.6rem;
    }

    .footer-contact-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 42px;
      padding: 0.66rem 0.68rem;
      border-radius: 14px;
      color: rgba(245, 245, 242, 0.72);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.09);
      font-size: 0.76rem;
      line-height: 1.15;
      text-align: center;
    }

    .footer-contact-item:hover,
    .footer-contact-item:focus-visible {
      transform: translateY(-2px);
    }

    .footer-contact-icon {
      width: 1.08rem;
      height: 1.08rem;
      flex: 0 0 auto;
    }

    .footer-contact-item span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .footer-bottom {
      padding: 0.9rem max(1rem, calc((100vw - var(--max-width)) / 2 + 1rem)) 1rem;
      gap: 0.65rem;
      flex-wrap: nowrap;
    }

    .footer-bottom p {
      font-size: 0.76rem;
      line-height: 1.3;
      white-space: nowrap;
    }

    .footer-bottom-separator {
      display: block;
      flex: 0 0 1px;
      height: 1rem;
    }
  }

  @media (max-width: 540px) {
    .footer-inner {
      width: min(100% - 1rem, var(--max-width));
      padding-top: 1.45rem;
    }

    .footer-main {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.3rem 1.05rem;
      padding-bottom: 1.35rem;
    }

    .footer-logo img {
      height: 48px;
      max-width: 138px;
    }

    .footer-column {
      gap: 0.98rem;
    }

    .footer-column-title {
      font-size: 0.68rem;
    }

    .footer-link-list {
      gap: 0.42rem;
    }

    .footer-link-list a {
      font-size: 0.83rem;
      line-height: 1.25;
    }

    .footer-column-contact {
      grid-column: 1 / -1;
    }

    .footer-contact-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.52rem;
    }

    .footer-contact-item {
      font-size: 0.72rem;
      padding-inline: 0.5rem;
    }

    .footer-contact-item-form {
      grid-column: 1 / -1;
    }

    .footer-bottom {
      padding-inline: 1rem;
      gap: 0.6rem;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .footer-bottom::-webkit-scrollbar {
      display: none;
    }
  }

  @media (max-width: 380px) {
    .footer-main {
      grid-template-columns: 1fr;
      gap: 1.2rem;
    }

    .footer-contact-list {
      grid-template-columns: 1fr;
    }

    .footer-contact-item-form {
      grid-column: auto;
    }
  }
</style>
