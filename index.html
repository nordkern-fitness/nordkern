<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nordkern Fitness – Für deinen Weg nach vorn</title>
  <meta
    name="description"
    content="Nordkern Fitness ist ein ruhiges, modernes 24/7-Fitnessstudio im Norden mit digitalem Zugang, klaren Tarifen und einer App für Mitgliedschaft, Tagespass, Urlaubspass und Zutritt."
  />

  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png?v=3" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png?v=3" />
  <link rel="icon" type="image/png" sizes="512x512" href="images/icon-512.png?v=3" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png?v=3" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    .home-page-v3 {
      background: #ffffff;
    }

    .home-hero-v3 {
      min-height: 68vh;
      display: grid;
      place-items: center;
      padding: max(8rem, 12vh) 1rem clamp(3rem, 4.8vw, 4.8rem);
      text-align: center;
      background:
        radial-gradient(
          ellipse 78% 48% at 50% 0%,
          rgba(46, 145, 63, 0.07) 0%,
          rgba(46, 145, 63, 0.025) 42%,
          rgba(255, 255, 255, 0) 74%
        ),
        #ffffff;
    }

    .home-hero-v3-inner {
      width: min(100%, 1040px);
      margin-inline: auto;
    }

    .home-hero-v3 .eyebrow {
      margin-bottom: 0.72rem;
    }

    .home-hero-v3 h1 {
      max-width: 960px;
      margin-inline: auto;
      color: var(--text);
      font-size: clamp(3.35rem, 5.9vw, 6.25rem);
      line-height: 0.94;
      letter-spacing: -0.072em;
      font-weight: 790;
      text-wrap: balance;
    }

    .home-hero-v3 p:not(.eyebrow) {
      max-width: 610px;
      margin: 1rem auto 0;
      color: var(--text-soft);
      font-size: clamp(1.03rem, 1.2vw, 1.16rem);
      line-height: 1.48;
      letter-spacing: -0.017em;
      text-wrap: balance;
    }

    .home-hero-v3 .product-actions {
      margin-top: 1.35rem;
    }

    .home-tile-section {
      padding: 0 0.75rem 0.75rem;
      background: #ffffff;
    }

    .home-studio-grid-v3 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 0.75rem;
    }

    .home-studio-tile-v3 {
      position: relative;
      min-height: clamp(520px, 48vw, 760px);
      overflow: hidden;
      background: #f5f5f7;
      isolation: isolate;
    }

    .home-studio-tile-v3:first-child {
      grid-row: span 2;
    }

    .home-studio-tile-v3-small {
      min-height: clamp(254px, 23.65vw, 374px);
    }

    .home-studio-tile-v3 img {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .home-studio-tile-v3::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 22%),
        linear-gradient(0deg, rgba(0, 0, 0, 0.28), transparent 38%);
    }

    .home-studio-tile-label {
      position: absolute;
      left: clamp(1rem, 2vw, 1.5rem);
      bottom: clamp(1rem, 2vw, 1.5rem);
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.66rem;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.34);
    }

    .home-studio-tile-label::before {
      content: "";
      width: 0.34rem;
      height: 0.34rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
    }

    .home-large-section-v4,
    .home-pass-section-v4 {
      padding: 0 0.75rem 0.75rem;
      background: #ffffff;
    }

    .home-pass-grid-v4 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .home-large-slot-v4,
    .home-pass-slot-v4 {
      min-width: 0;
      display: grid;
    }

    .home-large-card-v4,
    .home-pass-card-v4 {
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      text-align: center;
      isolation: isolate;
    }

    .home-large-card-v4 {
      min-height: clamp(480px, 54vh, 640px);
      padding: clamp(3.6rem, 6vw, 6rem) clamp(1.25rem, 4vw, 3rem);
    }

    .home-pass-card-v4 {
      min-height: clamp(500px, 48vw, 680px);
      padding: clamp(3rem, 5vw, 5rem) clamp(1.25rem, 3vw, 2.5rem);
    }

    .home-large-card-v4::before,
    .home-pass-card-v4::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
    }

    .home-studio-card-v4::before {
      background:
        radial-gradient(
          ellipse 88% 66% at 50% -8%,
          rgba(118, 224, 137, 0.64) 0%,
          rgba(118, 224, 137, 0.28) 38%,
          rgba(245, 245, 247, 0) 74%
        ),
        #f5f5f7;
    }

    .home-daypass-card-v4::before {
      background:
        radial-gradient(
          ellipse 88% 64% at 50% -4%,
          rgba(247, 207, 128, 0.32) 0%,
          rgba(247, 207, 128, 0.11) 44%,
          rgba(245, 245, 247, 0) 76%
        ),
        #f5f5f7;
    }

    .home-holidaypass-card-v4::before {
      background:
        radial-gradient(
          ellipse 88% 64% at 50% -4%,
          rgba(139, 190, 255, 0.28) 0%,
          rgba(139, 190, 255, 0.1) 44%,
          rgba(245, 245, 247, 0) 76%
        ),
        #f5f5f7;
    }

    .home-app-card-v4::before {
      background:
        radial-gradient(
          ellipse 74% 72% at 50% 0%,
          rgba(52, 164, 70, 0.16) 0%,
          rgba(52, 164, 70, 0.055) 46%,
          rgba(245, 245, 247, 0) 78%
        ),
        #f5f5f7;
    }

    .home-large-content-v4 {
      width: min(100%, 860px);
      margin-inline: auto;
    }

    .home-pass-content-v4 {
      width: min(100%, 560px);
      min-height: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-inline: auto;
    }

    .home-feature-eyebrow-v4 {
      margin: 0 0 0.72rem;
      color: var(--nf-green-dark);
      font-size: 0.74rem;
      line-height: 1;
      font-weight: 850;
      letter-spacing: 0.085em;
      text-transform: uppercase;
    }

    .home-large-title-v4 {
      max-width: 820px;
      margin-inline: auto;
      color: var(--text);
      font-size: clamp(2.85rem, 5vw, 5.15rem);
      line-height: 0.94;
      letter-spacing: -0.068em;
      font-weight: 790;
      text-wrap: balance;
    }

    .home-pass-title-v4 {
      max-width: 540px;
      margin-inline: auto;
      color: var(--text);
      font-size: clamp(2.75rem, 4.4vw, 4.65rem);
      line-height: 0.94;
      letter-spacing: -0.067em;
      font-weight: 790;
      text-wrap: balance;
    }

    .home-large-title-v4 span {
      color: var(--nf-green);
    }

    .home-pass-title-v4 span {
      display: block;
      max-width: 18ch;
      margin: 0.9rem auto 0;
      color: var(--text-soft);
      font-size: clamp(1.45rem, 2vw, 2.05rem);
      line-height: 1.12;
      letter-spacing: -0.042em;
      font-weight: 650;
      text-wrap: balance;
    }

    .home-large-copy-v4 {
      max-width: 660px;
      margin: 1rem auto 0;
      color: var(--text-soft);
      font-size: clamp(1.02rem, 1.22vw, 1.16rem);
      line-height: 1.5;
      letter-spacing: -0.016em;
      text-wrap: balance;
    }

    .home-pass-copy-v4 {
      max-width: 480px;
      margin: 1.15rem auto 0;
      color: var(--text-soft);
      font-size: clamp(0.98rem, 1.08vw, 1.07rem);
      line-height: 1.5;
      letter-spacing: -0.014em;
      text-wrap: balance;
    }

    .home-feature-meta-v4 {
      width: fit-content;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1.15rem;
      padding: 0.5rem 0.8rem;
      border-radius: 999px;
      color: var(--nf-green-dark);
      background: rgba(46, 145, 63, 0.07);
      border: 1px solid rgba(46, 145, 63, 0.13);
      font-size: 0.82rem;
      font-weight: 720;
      letter-spacing: -0.012em;
    }

    .home-feature-actions-v4 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      flex-wrap: wrap;
      margin-top: 1.4rem;
    }

    .home-feature-link-v4 {
      color: var(--nf-green-dark);
      font-size: 0.98rem;
      font-weight: 590;
      letter-spacing: -0.014em;
      transition:
        color var(--fast),
        transform var(--fast);
    }

    .home-feature-link-v4::after {
      content: "›";
      padding-left: 0.25rem;
    }

    .home-feature-link-v4:hover,
    .home-feature-link-v4:focus-visible {
      color: var(--nf-green);
      transform: translateY(-1px);
    }

    .home-app-layout-v4 {
      width: min(100%, 930px);
      display: grid;
      grid-template-columns: auto minmax(0, 650px);
      align-items: center;
      justify-content: center;
      gap: clamp(2.8rem, 5vw, 5rem);
      margin-inline: auto;
      text-align: left;
    }

    .home-app-icon-v4 {
      width: clamp(82px, 7vw, 112px);
      height: clamp(82px, 7vw, 112px);
      overflow: hidden;
      border-radius: 22%;
      background: #111111;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.14);
    }

    .home-app-icon-v4 img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .home-app-text-v4 {
      min-width: 0;
    }

    .home-app-text-v4 .home-feature-eyebrow-v4 {
      margin-bottom: 0.72rem;
    }

    .home-app-text-v4 .home-large-title-v4,
    .home-app-text-v4 .home-large-copy-v4 {
      margin-left: 0;
      margin-right: 0;
      text-align: left;
    }

    .home-app-text-v4 .home-feature-actions-v4 {
      justify-content: flex-start;
    }

    @media (max-width: 900px) {
      .home-hero-v3 {
        min-height: 66vh;
      }

      .home-hero-v3 h1 {
        max-width: 10ch;
        font-size: clamp(3.1rem, 12vw, 5rem);
        line-height: 0.94;
      }

      .home-studio-grid-v3 {
        grid-template-columns: 1fr;
      }

      .home-studio-tile-v3:first-child {
        grid-row: auto;
      }

      .home-studio-tile-v3,
      .home-studio-tile-v3-small {
        min-height: 430px;
      }

      .home-pass-grid-v4 {
        grid-template-columns: 1fr;
      }

      .home-pass-card-v4 {
        min-height: 500px;
      }

      .home-pass-content-v4 {
        min-height: 320px;
      }

      .home-app-layout-v4 {
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 1.5rem;
        text-align: center;
      }

      .home-app-text-v4 .home-large-title-v4,
      .home-app-text-v4 .home-large-copy-v4 {
        margin-inline: auto;
        text-align: center;
      }

      .home-app-text-v4 .home-feature-actions-v4 {
        justify-content: center;
      }
    }

    @media (max-width: 560px) {
      .home-hero-v3 {
        min-height: 66vh;
        padding-top: max(8rem, 13vh);
        padding-bottom: 3rem;
      }

      .home-hero-v3 h1 {
        font-size: clamp(2.65rem, 13vw, 3.7rem);
      }

      .home-hero-v3 p:not(.eyebrow) {
        max-width: 34ch;
        font-size: 1rem;
      }

      .home-hero-v3 .product-actions {
        width: min(100%, 310px);
        margin-inline: auto;
      }

      .home-hero-v3 .product-link {
        width: 100%;
      }

      .home-tile-section,
      .home-large-section-v4,
      .home-pass-section-v4 {
        padding-left: 0.5rem;
        padding-right: 0.5rem;
        padding-bottom: 0.5rem;
      }

      .home-studio-grid-v3,
      .home-pass-grid-v4 {
        gap: 0.5rem;
      }

      .home-studio-tile-v3,
      .home-studio-tile-v3-small {
        min-height: 330px;
      }

      .home-large-card-v4 {
        min-height: 450px;
        padding: 3.6rem 1rem;
      }

      .home-pass-card-v4 {
        min-height: 450px;
        padding: 3.3rem 1rem;
      }

      .home-pass-content-v4 {
        min-height: 300px;
      }

      .home-large-title-v4 {
        max-width: 11ch;
        font-size: clamp(2.35rem, 11.5vw, 3.55rem);
      }

      .home-pass-title-v4 {
        max-width: 12ch;
        font-size: clamp(2.55rem, 12vw, 3.65rem);
      }

      .home-pass-title-v4 span {
        max-width: 14ch;
        margin-top: 0.75rem;
        font-size: clamp(1.3rem, 6vw, 1.65rem);
        line-height: 1.14;
      }

      .home-large-copy-v4,
      .home-pass-copy-v4 {
        max-width: 34ch;
        font-size: 1rem;
      }

      .home-feature-actions-v4 {
        gap: 1rem;
      }

      .home-app-icon-v4 {
        width: 72px;
        height: 72px;
      }
    }
  </style>
</head>

<body>
  <div data-header></div>

  <main class="home-page-v3">
    <section class="home-hero-v3" aria-labelledby="home-hero-title">
      <div class="home-hero-v3-inner">
        <p class="eyebrow">Nordkern Fitness</p>

        <h1 id="home-hero-title">Für deinen Weg nach vorn.</h1>

        <p>
          Trainiere in einem modernen 24/7-Studio mit digitalem Zugang,
          klaren Tarifen und flexiblen Pässen — ruhig, direkt und jederzeit bereit.
        </p>

        <div class="product-actions" aria-label="Wichtige Links">
          <a href="mitgliedschaften.html" class="product-link product-link-primary">
            Tarife ansehen
          </a>

          <a href="standorte.html" class="product-link product-link-secondary">
            Standort ansehen
          </a>

          <a href="app.html" class="product-link product-link-secondary">
            App ansehen
          </a>
        </div>
      </div>
    </section>

    <section class="home-tile-section" aria-label="Nordkern Fitness Studio Grevesmühlen">
      <div class="home-studio-grid-v3">
        <article class="home-studio-tile-v3">
          <img src="images/H1.png" alt="" aria-hidden="true" />
          <span class="home-studio-tile-label">Studio Grevesmühlen</span>
        </article>

        <article class="home-studio-tile-v3 home-studio-tile-v3-small">
          <img src="images/H2.png" alt="" aria-hidden="true" />
          <span class="home-studio-tile-label">Studio Grevesmühlen</span>
        </article>

        <article class="home-studio-tile-v3 home-studio-tile-v3-small">
          <img src="images/H3.png" alt="" aria-hidden="true" />
          <span class="home-studio-tile-label">Studio Grevesmühlen</span>
        </article>
      </div>
    </section>

    <section class="home-large-section-v4" aria-label="Studio Grevesmühlen">
      <div class="home-large-slot-v4" data-home-section-studio></div>
    </section>

    <section class="home-pass-section-v4" aria-label="Tagespass und Urlaubspass">
      <div class="home-pass-grid-v4">
        <div class="home-pass-slot-v4" data-home-section-tagespass></div>
        <div class="home-pass-slot-v4" data-home-section-urlaubspass></div>
      </div>
    </section>

    <section class="home-large-section-v4" aria-label="Nordkern Fitness App">
      <div class="home-large-slot-v4" data-home-section-app></div>
    </section>
  </main>

  <div data-footer></div>

  <script src="js/main.js?v=7"></script>
</body>
</html>
