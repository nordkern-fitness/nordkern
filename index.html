<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nordkern Fitness – Für deinen Weg nach vorn</title>
  <meta
    name="description"
    content="Nordkern Fitness ist ein ruhiges, modernes 24/7-Fitnessstudio im Norden mit digitalem Zugang, klaren Tarifen und einer App für Mitgliedschaft, Tagespass, Urlaubspass und Zutritt."
  />

  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png?v=3" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png?v=3" />
  <link rel="icon" type="image/png" sizes="512x512" href="images/icon-512.png?v=3" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png?v=3" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    .home-page-v3 {
      background: #ffffff;
    }

    .home-hero-v3 {
      min-height: 68vh;
      display: grid;
      place-items: center;
      padding: max(8rem, 12vh) 1rem clamp(3rem, 4.8vw, 4.8rem);
      text-align: center;
      background:
        radial-gradient(
          ellipse 78% 48% at 50% 0%,
          rgba(46, 145, 63, 0.07) 0%,
          rgba(46, 145, 63, 0.025) 42%,
          rgba(255, 255, 255, 0) 74%
        ),
        #ffffff;
    }

    .home-hero-v3-inner {
      width: min(100%, 1040px);
      margin-inline: auto;
    }

    .home-hero-v3 .eyebrow {
      margin-bottom: 0.72rem;
    }

    .home-hero-v3 h1 {
      max-width: 960px;
      margin-inline: auto;
      color: var(--text);
      font-size: clamp(3.35rem, 5.9vw, 6.25rem);
      line-height: 0.94;
      letter-spacing: -0.072em;
      font-weight: 790;
      text-wrap: balance;
    }

    .home-hero-v3 p:not(.eyebrow) {
      max-width: 610px;
      margin: 1rem auto 0;
      color: var(--text-soft);
      font-size: clamp(1.03rem, 1.2vw, 1.16rem);
      line-height: 1.48;
      letter-spacing: -0.017em;
      text-wrap: balance;
    }

    .home-hero-v3 .product-actions {
      margin-top: 1.35rem;
    }

    .home-tile-section {
      padding: 0 0.75rem 0.75rem;
      background: #ffffff;
    }

    .home-studio-grid-v3 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 0.75rem;
    }

    .home-studio-tile-v3 {
      position: relative;
      min-height: clamp(520px, 48vw, 760px);
      overflow: hidden;
      background: #f5f5f7;
      isolation: isolate;
    }

    .home-studio-tile-v3:first-child {
      grid-row: span 2;
    }

    .home-studio-tile-v3-small {
      min-height: clamp(254px, 23.65vw, 374px);
    }

    .home-studio-tile-v3 img {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .home-studio-tile-v3::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 22%),
        linear-gradient(0deg, rgba(0, 0, 0, 0.28), transparent 38%);
    }

    .home-studio-tile-label {
      position: absolute;
      left: clamp(1rem, 2vw, 1.5rem);
      bottom: clamp(1rem, 2vw, 1.5rem);
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.66rem;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.34);
    }

    .home-studio-tile-label::before {
      content: "";
      width: 0.34rem;
      height: 0.34rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
    }

    .home-feature-row-v4 {
      padding: 0 0.75rem 0.75rem;
      background: #ffffff;
    }

    .home-feature-grid-v4 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .home-feature-slot-v4 {
      min-width: 0;
      display: grid;
    }

    .home-feature-card-v4 {
      position: relative;
      min-height: clamp(500px, 49vw, 690px);
      display: grid;
      place-items: center;
      padding: clamp(3rem, 5vw, 5rem) clamp(1.25rem, 3vw, 2.5rem);
      overflow: hidden;
      text-align: center;
      background: #f5f5f7;
      isolation: isolate;
    }

    .home-feature-card-v4::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
    }

    .home-feature-card-studio-v4::before {
      background:
        radial-gradient(
          ellipse 96% 65% at 50% -4%,
          rgba(125, 226, 144, 0.72) 0%,
          rgba(125, 226, 144, 0.34) 34%,
          rgba(245, 245, 247, 0) 74%
        ),
        #f5f5f7;
    }

    .home-feature-card-day-v4::before {
      background:
        radial-gradient(
          ellipse 85% 62% at 50% 0%,
          rgba(255, 205, 112, 0.34) 0%,
          rgba(255, 205, 112, 0.14) 42%,
          rgba(245, 245, 247, 0) 74%
        ),
        #f5f5f7;
    }

    .home-feature-card-app-v4::before {
      background:
        radial-gradient(
          ellipse 82% 62% at 50% 0%,
          rgba(46, 145, 63, 0.18) 0%,
          rgba(46, 145, 63, 0.07) 44%,
          rgba(245, 245, 247, 0) 75%
        ),
        #f5f5f7;
    }

    .home-feature-card-holiday-v4::before {
      background:
        radial-gradient(
          ellipse 88% 64% at 50% 0%,
          rgba(112, 181, 255, 0.28) 0%,
          rgba(112, 181, 255, 0.11) 42%,
          rgba(245, 245, 247, 0) 74%
        ),
        #f5f5f7;
    }

    .home-feature-content-v4 {
      width: min(100%, 590px);
      margin-inline: auto;
    }

    .home-feature-eyebrow-v4 {
      margin-bottom: 0.78rem;
      color: var(--nf-green-dark);
      font-size: 0.76rem;
      line-height: 1;
      font-weight: 850;
      letter-spacing: 0.085em;
      text-transform: uppercase;
    }

    .home-feature-title-v4 {
      max-width: 580px;
      margin-inline: auto;
      color: var(--text);
      font-size: clamp(2.65rem, 4.55vw, 4.85rem);
      line-height: 0.94;
      letter-spacing: -0.067em;
      font-weight: 790;
      text-wrap: balance;
    }

    .home-feature-title-v4 span {
      display: block;
      color: var(--nf-green);
    }

    .home-feature-copy-v4 {
      max-width: 520px;
      margin: 1rem auto 0;
      color: var(--text-soft);
      font-size: clamp(1rem, 1.16vw, 1.12rem);
      line-height: 1.5;
      letter-spacing: -0.015em;
      text-wrap: balance;
    }

    .home-feature-meta-v4 {
      width: fit-content;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.42rem;
      margin-top: 1.15rem;
      padding: 0.55rem 0.82rem;
      border-radius: 999px;
      color: var(--nf-green-dark);
      background: rgba(46, 145, 63, 0.08);
      border: 1px solid rgba(46, 145, 63, 0.14);
      font-size: 0.84rem;
      font-weight: 720;
      letter-spacing: -0.012em;
    }

    .home-feature-actions-v4 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.3rem;
      flex-wrap: wrap;
      margin-top: 1.3rem;
    }

    .home-feature-link-v4 {
      color: var(--nf-green-dark);
      font-size: 1rem;
      font-weight: 590;
      letter-spacing: -0.014em;
      transition:
        color var(--fast),
        transform var(--fast);
    }

    .home-feature-link-v4::after {
      content: "›";
      padding-left: 0.28rem;
    }

    .home-feature-link-v4:hover,
    .home-feature-link-v4:focus-visible {
      color: var(--nf-green);
      transform: translateY(-1px);
    }

    .home-feature-app-icon-v4 {
      width: clamp(64px, 5.4vw, 82px);
      height: clamp(64px, 5.4vw, 82px);
      margin: 0 auto 1.35rem;
      overflow: hidden;
      border-radius: 22%;
      background: #111111;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.13);
    }

    .home-feature-app-icon-v4 img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @media (max-width: 900px) {
      .home-hero-v3 {
        min-height: 66vh;
      }

      .home-hero-v3 h1 {
        max-width: 10ch;
        font-size: clamp(3.1rem, 12vw, 5rem);
        line-height: 0.94;
      }

      .home-studio-grid-v3,
      .home-feature-grid-v4 {
        grid-template-columns: 1fr;
      }

      .home-studio-tile-v3:first-child {
        grid-row: auto;
      }

      .home-studio-tile-v3,
      .home-studio-tile-v3-small {
        min-height: 430px;
      }

      .home-feature-card-v4 {
        min-height: 520px;
      }
    }

    @media (max-width: 560px) {
      .home-hero-v3 {
        min-height: 66vh;
        padding-top: max(8rem, 13vh);
        padding-bottom: 3rem;
      }

      .home-hero-v3 h1 {
        font-size: clamp(2.65rem, 13vw, 3.7rem);
      }

      .home-hero-v3 p:not(.eyebrow) {
        max-width: 34ch;
        font-size: 1rem;
      }

      .home-hero-v3 .product-actions {
        width: min(100%, 310px);
        margin-inline: auto;
      }

      .home-hero-v3 .product-link {
        width: 100%;
      }

      .home-tile-section,
      .home-feature-row-v4 {
        padding-left: 0.5rem;
        padding-right: 0.5rem;
        padding-bottom: 0.5rem;
      }

      .home-studio-grid-v3,
      .home-feature-grid-v4 {
        gap: 0.5rem;
      }

      .home-studio-tile-v3,
      .home-studio-tile-v3-small {
        min-height: 330px;
      }

      .home-feature-card-v4 {
        min-height: 450px;
        padding: 3.5rem 1rem;
      }

      .home-feature-title-v4 {
        max-width: 11ch;
        font-size: clamp(2.35rem, 11.5vw, 3.45rem);
      }

      .home-feature-copy-v4 {
        max-width: 34ch;
        font-size: 1rem;
      }

      .home-feature-actions-v4 {
        gap: 1rem;
      }
    }
  </style>
</head>

<body>
  <div data-header></div>

  <main class="home-page-v3">
    <section class="home-hero-v3" aria-labelledby="home-hero-title">
      <div class="home-hero-v3-inner">
        <p class="eyebrow">Nordkern Fitness</p>

        <h1 id="home-hero-title">Für deinen Weg nach vorn.</h1>

        <p>
          Trainiere in einem modernen 24/7-Studio mit digitalem Zugang,
          klaren Tarifen und flexiblen Pässen — ruhig, direkt und jederzeit bereit.
        </p>

        <div class="product-actions" aria-label="Wichtige Links">
          <a href="mitgliedschaften.html" class="product-link product-link-primary">
            Tarife ansehen
          </a>

          <a href="standorte.html" class="product-link product-link-secondary">
            Standort ansehen
          </a>

          <a href="app.html" class="product-link product-link-secondary">
            App ansehen
          </a>
        </div>
      </div>
    </section>

    <section class="home-tile-section" aria-label="Nordkern Fitness Studio Grevesmühlen">
      <div class="home-studio-grid-v3">
        <article class="home-studio-tile-v3">
          <img src="images/H1.png" alt="" aria-hidden="true" />
          <span class="home-studio-tile-label">Studio Grevesmühlen</span>
        </article>

        <article class="home-studio-tile-v3 home-studio-tile-v3-small">
          <img src="images/H2.png" alt="" aria-hidden="true" />
          <span class="home-studio-tile-label">Studio Grevesmühlen</span>
        </article>

        <article class="home-studio-tile-v3 home-studio-tile-v3-small">
          <img src="images/H3.png" alt="" aria-hidden="true" />
          <span class="home-studio-tile-label">Studio Grevesmühlen</span>
        </article>
      </div>
    </section>

    <section class="home-feature-row-v4" aria-label="Studio und Tagespass">
      <div class="home-feature-grid-v4">
        <div class="home-feature-slot-v4" data-home-section-studio></div>
        <div class="home-feature-slot-v4" data-home-section-tagespass></div>
      </div>
    </section>

    <section class="home-feature-row-v4" aria-label="App und Urlaubspass">
      <div class="home-feature-grid-v4">
        <div class="home-feature-slot-v4" data-home-section-app></div>
        <div class="home-feature-slot-v4" data-home-section-urlaubspass></div>
      </div>
    </section>
  </main>

  <div data-footer></div>

  <script src="js/main.js?v=5"></script>
</body>
</html>
