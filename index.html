<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nordkern Fitness – Für deinen Weg nach vorn</title>
  <meta
    name="description"
    content="Nordkern Fitness ist ein ruhiges, modernes 24/7-Fitnessstudio im Norden mit digitalem Zugang, klaren Tarifen und einer App für Mitgliedschaft, Tagespass, Urlaubspass und Zutritt."
  />

  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png?v=3" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png?v=3" />
  <link rel="icon" type="image/png" sizes="512x512" href="images/icon-512.png?v=3" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png?v=3" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    .home-page-v3 {
      background: #ffffff;
    }

    .home-hero-v3 {
      min-height: 68vh;
      display: grid;
      place-items: center;
      padding: max(8rem, 12vh) 1rem clamp(3rem, 4.8vw, 4.8rem);
      text-align: center;
      background:
        radial-gradient(
          ellipse 78% 48% at 50% 0%,
          rgba(46, 145, 63, 0.07) 0%,
          rgba(46, 145, 63, 0.025) 42%,
          rgba(255, 255, 255, 0) 74%
        ),
        #ffffff;
    }

    .home-hero-v3-inner {
      width: min(100%, 1040px);
      margin-inline: auto;
    }

    .home-hero-v3 .eyebrow {
      margin-bottom: 0.72rem;
    }

    .home-hero-v3 h1 {
      max-width: 960px;
      margin-inline: auto;
      color: var(--text);
      font-size: clamp(3.35rem, 5.9vw, 6.25rem);
      line-height: 0.94;
      letter-spacing: -0.072em;
      font-weight: 790;
      text-wrap: balance;
    }

    .home-hero-v3 p:not(.eyebrow) {
      max-width: 610px;
      margin: 1rem auto 0;
      color: var(--text-soft);
      font-size: clamp(1.03rem, 1.2vw, 1.16rem);
      line-height: 1.48;
      letter-spacing: -0.017em;
      text-wrap: balance;
    }

    .home-hero-v3 .product-actions {
      margin-top: 1.35rem;
    }

    .home-tile-section {
      padding: 0 0.75rem 0.75rem;
      background: #ffffff;
    }

    .home-studio-grid-v3 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 0.75rem;
    }

    .home-studio-tile-v3 {
      position: relative;
      min-height: clamp(520px, 48vw, 760px);
      overflow: hidden;
      background: #f5f5f7;
      isolation: isolate;
    }

    .home-studio-tile-v3:first-child {
      grid-row: span 2;
    }

    .home-studio-tile-v3-small {
      min-height: clamp(254px, 23.65vw, 374px);
    }

    .home-studio-tile-v3 img {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .home-studio-tile-v3::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 22%),
        linear-gradient(0deg, rgba(0, 0, 0, 0.28), transparent 38%);
    }

    .home-studio-tile-label {
      position: absolute;
      left: clamp(1rem, 2vw, 1.5rem);
      bottom: clamp(1rem, 2vw, 1.5rem);
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.66rem;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.34);
    }

    .home-studio-tile-label::before {
      content: "";
      width: 0.34rem;
      height: 0.34rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
    }

    .home-access-v3,
    .home-app-v3 {
      padding: 0 0.75rem 0.75rem;
      background: #ffffff;
    }

    .home-access-panel-v3 {
      min-height: clamp(440px, 50vh, 600px);
      display: grid;
      place-items: center;
      padding: clamp(3.2rem, 5.2vw, 5.2rem) 1.25rem;
      text-align: center;
      overflow: hidden;
      background:
        radial-gradient(
          ellipse 92% 64% at 50% -8%,
          rgba(125, 226, 144, 0.72) 0%,
          rgba(125, 226, 144, 0.54) 24%,
          rgba(125, 226, 144, 0.28) 46%,
          rgba(125, 226, 144, 0.08) 68%,
          rgba(245, 245, 247, 0) 86%
        ),
        radial-gradient(
          ellipse 74% 46% at 50% 18%,
          rgba(46, 145, 63, 0.18) 0%,
          rgba(46, 145, 63, 0.08) 42%,
          rgba(245, 245, 247, 0) 78%
        ),
        linear-gradient(
          180deg,
          rgba(246, 255, 247, 0.72) 0%,
          rgba(245, 245, 247, 0) 58%
        ),
        #f5f5f7;
    }

    .home-access-content-v3 {
      width: min(100%, 900px);
      margin-inline: auto;
    }

    .home-access-panel-v3 h2 {
      max-width: 780px;
      margin-inline: auto;
      color: var(--text);
      font-size: clamp(2.55rem, 4.65vw, 4.9rem);
      line-height: 0.94;
      letter-spacing: -0.064em;
      font-weight: 790;
      text-wrap: balance;
    }

    .home-access-panel-v3 p {
      max-width: 650px;
      margin: 0.95rem auto 0;
      color: var(--text-soft);
      font-size: clamp(1rem, 1.18vw, 1.12rem);
      line-height: 1.48;
      letter-spacing: -0.016em;
      text-wrap: balance;
    }

    .home-app-panel-v3 {
      min-height: clamp(300px, 34vh, 390px);
      display: grid;
      place-items: center;
      padding: clamp(2rem, 3.4vw, 3.4rem) 1.25rem;
      text-align: left;
      background: #f5f5f7;
      overflow: hidden;
    }

    .home-app-content-v3 {
      width: fit-content;
      max-width: min(100%, 820px);
      display: grid;
      grid-template-columns: auto minmax(0, 560px);
      align-items: center;
      justify-content: center;
      gap: clamp(2rem, 3.8vw, 3.5rem);
      margin-inline: auto;
    }

    .home-app-icon-v3 {
      width: clamp(58px, 4.6vw, 72px);
      height: clamp(58px, 4.6vw, 72px);
      overflow: hidden;
      border-radius: 22%;
      background: #111111;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.12);
    }

    .home-app-icon-v3 img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .home-app-text-v3 {
      min-width: 0;
    }

    .home-app-panel-v3 h2 {
      max-width: 560px;
      margin: 0;
      color: var(--text);
      font-size: clamp(2.15rem, 3.35vw, 3.45rem);
      line-height: 0.98;
      letter-spacing: -0.058em;
      font-weight: 790;
      text-wrap: balance;
    }

    .home-app-panel-v3 p {
      max-width: 540px;
      margin: 0.78rem 0 0;
      color: var(--text-soft);
      font-size: clamp(0.98rem, 1.12vw, 1.07rem);
      line-height: 1.45;
      letter-spacing: -0.014em;
      text-wrap: balance;
    }

    .home-app-links-v3 {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 1.35rem;
      flex-wrap: wrap;
      margin-top: 1.05rem;
    }

    .home-app-links-v3 a {
      color: var(--nf-green-dark);
      font-size: 0.98rem;
      font-weight: 560;
      letter-spacing: -0.012em;
    }

    .home-app-links-v3 a::after {
      content: "›";
      padding-left: 0.28rem;
    }

    .home-app-links-v3 a:hover,
    .home-app-links-v3 a:focus-visible {
      color: var(--nf-green);
    }

    @media (max-width: 900px) {
      .home-hero-v3 {
        min-height: 66vh;
      }

      .home-hero-v3 h1 {
        max-width: 10ch;
        font-size: clamp(3.1rem, 12vw, 5rem);
        line-height: 0.94;
      }

      .home-studio-grid-v3 {
        grid-template-columns: 1fr;
      }

      .home-studio-tile-v3:first-child {
        grid-row: auto;
      }

      .home-studio-tile-v3,
      .home-studio-tile-v3-small {
        min-height: 430px;
      }

      .home-access-panel-v3 h2 {
        font-size: clamp(2.45rem, 9.6vw, 4.1rem);
      }

      .home-app-panel-v3 {
        min-height: 360px;
        text-align: center;
      }

      .home-app-content-v3 {
        width: min(100%, 680px);
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 1.35rem;
      }

      .home-app-panel-v3 h2,
      .home-app-panel-v3 p {
        margin-inline: auto;
      }

      .home-app-links-v3 {
        justify-content: center;
      }
    }

    @media (max-width: 560px) {
      .home-hero-v3 {
        min-height: 66vh;
        padding-top: max(8rem, 13vh);
        padding-bottom: 3rem;
      }

      .home-hero-v3 h1 {
        font-size: clamp(2.65rem, 13vw, 3.7rem);
      }

      .home-hero-v3 p:not(.eyebrow) {
        max-width: 34ch;
        font-size: 1rem;
      }

      .home-hero-v3 .product-actions {
        width: min(100%, 310px);
        margin-inline: auto;
      }

      .home-hero-v3 .product-link {
        width: 100%;
      }

      .home-tile-section,
      .home-access-v3,
      .home-app-v3 {
        padding-left: 0.5rem;
        padding-right: 0.5rem;
        padding-bottom: 0.5rem;
      }

      .home-studio-grid-v3 {
        gap: 0.5rem;
      }

      .home-studio-tile-v3,
      .home-studio-tile-v3-small {
        min-height: 330px;
      }

      .home-access-panel-v3 {
        min-height: 430px;
        padding: 3.5rem 1rem;
      }

      .home-access-panel-v3 h2 {
        font-size: clamp(2.25rem, 11vw, 3.35rem);
      }

      .home-access-panel-v3 p {
        max-width: 34ch;
        font-size: 1rem;
      }

      .home-app-panel-v3 {
        min-height: 340px;
        padding: 3rem 1rem;
      }

      .home-app-panel-v3 h2 {
        max-width: 12ch;
        font-size: clamp(2rem, 10vw, 2.75rem);
        line-height: 1;
      }

      .home-app-panel-v3 p {
        max-width: 34ch;
        font-size: 0.98rem;
      }

      .home-app-icon-v3 {
        width: 58px;
        height: 58px;
      }
    }
  </style>
</head>

<body>
  <div data-header></div>

  <main class="home-page-v3">
    <section class="home-hero-v3" aria-labelledby="home-hero-title">
      <div class="home-hero-v3-inner">
        <p class="eyebrow">Nordkern Fitness</p>

        <h1 id="home-hero-title">Für deinen Weg nach vorn.</h1>

        <p>
          Trainiere in einem modernen 24/7-Studio mit digitalem Zugang,
          klaren Tarifen und flexiblen Pässen — ruhig, direkt und jederzeit bereit.
        </p>

        <div class="product-actions" aria-label="Wichtige Links">
          <a href="mitgliedschaften.html" class="product-link product-link-primary">
            Tarife ansehen
          </a>

          <a href="standorte.html" class="product-link product-link-secondary">
            Standort ansehen
          </a>

          <a href="app.html" class="product-link product-link-secondary">
            App ansehen
          </a>
        </div>
      </div>
    </section>

    <section class="home-tile-section" aria-label="Nordkern Fitness Studio Grevesmühlen">
      <div class="home-studio-grid-v3">
        <article class="home-studio-tile-v3">
          <img src="images/H1.png" alt="" aria-hidden="true" />
          <span class="home-studio-tile-label">Studio Grevesmühlen</span>
        </article>

        <article class="home-studio-tile-v3 home-studio-tile-v3-small">
          <img src="images/H2.png" alt="" aria-hidden="true" />
          <span class="home-studio-tile-label">Studio Grevesmühlen</span>
        </article>

        <article class="home-studio-tile-v3 home-studio-tile-v3-small">
          <img src="images/H3.png" alt="" aria-hidden="true" />
          <span class="home-studio-tile-label">Studio Grevesmühlen</span>
        </article>
      </div>
    </section>

    <div data-home-section-studio></div>

    <div data-home-section-app></div>
  </main>

  <div data-footer></div>

  <script src="js/main.js"></script>
</body>
</html>
